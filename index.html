<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Alert App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f9fa;
        }
        h1 { color: #333; }
        #status { color: #666; margin-bottom: 30px; }
        .sos-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: #ff3b30;
            color: white;
            font-size: 32px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255,59,48,0.3);
            transition: transform 0.1s;
        }
        .sos-button:active {
            transform: scale(0.95);
            background-color: #d63026;
        }
    </style>
</head>
<body>

    <h1>ระบบแจ้งเหตุฉุกเฉิน</h1>
    <p id="status">ระบบพร้อมใช้งาน</p>

    <button class="sos-button" onclick="triggerSOS()">SOS</button>

    <script src="app.js"></script>
</body>
</html>
